<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Воридшавӣ | Суратгирхонаи Диловар</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.login{
  width:320px;
  padding:30px;
  background:#1c1c1c;
  border-radius:18px;
  text-align:center;
}
h2{color:#d4af37;}
input{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
button{
  padding:12px 25px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#d4af37;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="login">
  <h2>Суратгирхонаи Диловар</h2>
  <p>Воридшавӣ</p>

  <input type="text" placeholder="Логин">
  <input type="password" placeholder="Парол">

  <br>
  <button>Ворид шудан</button>
</div>

</body>
</html>
